name: Release

# Publishes to PyPI when a GitHub release is published, using trusted publishing
# (no API tokens). See "Releasing" in CONTRIBUTING.md for the steps and setup.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # PyBullet has a Linux wheel for 3.11, so testing the wheel doesn't compile it.
          python-version: "3.11"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version (expected v$version)"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Test the built wheel
        run: |
          pip install "$(ls dist/*.whl)[video]" pytest
          pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/meshsim/
    permissions:
      id-token: write  # trusted publishing: PyPI verifies this workflow's identity
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
